[pytest]
addopts = -m "not slow" --strict-markers --cov=src --cov-report=term-missing --cov-report=html --dist=loadfile
pythonpath = .
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

markers =
    smoke: Дымовые тесты для критического функционала
    regression: Полный набор регрессионных тестов
    slow: Медленные тесты (например, с доступом к сети)
filterwarnings =
    ignore::DeprecationWarning     

field = int(n:= input())-1 if n in set('1234') else 0
athletes.sort(key=lambda x: x[field])